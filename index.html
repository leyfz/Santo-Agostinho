<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Santo Agostinho • Biblioteca Minimal</title>
<meta name="theme-color" content="#0f172a" />
<meta name="description" content="SPA minimalista com rotas, busca, i18n, notas Markdown, comentários offline e quiz sobre Santo Agostinho." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%220.9em%22 font-size=%2290%22>📘</text></svg>">
<style>
  :root{
    --bg:#ffffff; --text:#0f172a; --muted:#475569; --border:#e2e8f0; --accent:#2563eb;
    --panel:#ffffff; --panel-2:#f8fafc; --radius:12px; --maxw:960px; --fs:16px
  }
  [data-theme="dark"]{
    --bg:#0b1020; --text:#e6ecff; --muted:#9aa3c7; --border:#1f2a44; --accent:#60a5fa;
    --panel:#121a33; --panel-2:#0e152b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font:400 var(--fs)/1.6 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", Arial;
    background:var(--bg); color:var(--text);
  }
  a{color:inherit; text-decoration:none}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
  /* Header */
  header.site{
    position:sticky; top:0; z-index:5; background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .topbar{display:flex; align-items:center; gap:12px; justify-content:space-between; padding:12px 0}
  .brand{display:flex; align-items:center; gap:12px}
  .brand .logo{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--border);font-size:20px}
  .brand h1{font-size:1rem; margin:0}
  nav.menu{display:flex; gap:8px; flex-wrap:wrap}
  nav.menu a{padding:6px 10px; border-radius:8px}
  nav.menu a.active, nav.menu a:hover{background:var(--panel-2)}
  .tools{display:flex; gap:8px; align-items:center}
  .ghost, .btn, button{
    cursor:pointer; border:1px solid var(--border); background:var(--panel); color:inherit;
    border-radius:10px; padding:8px 10px; font:inherit;
  }
  .btn{background:var(--accent); color:#fff; border-color:transparent}
  .field{display:flex; align-items:center; gap:8px}
  .search{display:flex; align-items:center; gap:8px; border:1px solid var(--border); padding:6px 10px; border-radius:10px; background:var(--panel-2)}
  .search input{border:0; outline:none; background:transparent; width:180px; color:inherit}
  /* Content */
  main{padding:20px 0}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px}
  .muted{color:var(--muted)}
  .grid{display:grid; gap:14px}
  .cols-2{grid-template-columns:repeat(2,1fr)}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .card{padding:14px}
  .tag{font-size:.75rem; padding:2px 8px; border:1px solid var(--border); border-radius:999px}
  .timeline{border-left:2px solid var(--border); padding-left:14px}
  .timeline .row{padding:8px 0}
  ul.clean{margin:0; padding-left:18px}
  mark{background:rgba(37,99,235,.18); border-radius:4px; padding:.05em .2em}
  textarea, input, select{font:inherit; color:inherit}
  textarea{width:100%; min-height:140px; border-radius:10px; border:1px solid var(--border); padding:10px; background:var(--panel-2)}
  .comment{border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--panel-2)}
  footer.site{padding:24px 0; color:var(--muted); border-top:1px solid var(--border); margin-top:40px}
  @media (max-width:900px){ .cols-3{grid-template-columns:1fr} .cols-2{grid-template-columns:1fr} .search input{width:120px} }
  @media print{ header.site, .tools, nav.menu, .search, footer.site{display:none!important} main{padding:0} .panel{border:0} }
</style>
</head>
<body data-theme="light">
<header class="site">
  <div class="wrap topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">📘</div>
      <h1 id="siteTitle">Santo Agostinho</h1>
    </div>
    <nav class="menu" id="menu">
      <a href="#/" data-route data-i18n="menu.home" class="active">Início</a>
      <a href="#/vida" data-route data-i18n="menu.life">Vida</a>
      <a href="#/obras" data-route data-i18n="menu.works">Obras</a>
      <a href="#/conceitos" data-route data-i18n="menu.concepts">Conceitos</a>
      <a href="#/frases" data-route data-i18n="menu.quotes">Frases</a>
      <a href="#/linha" data-route data-i18n="menu.timeline">Linha</a>
      <a href="#/quiz" data-route>Quiz</a>
      <a href="#/notas" data-route data-i18n="menu.notes">Notas</a>
      <a href="#/comentarios" data-route data-i18n="menu.comments">Comentários</a>
      <a href="#/sobre" data-route data-i18n="menu.about">Sobre</a>
    </nav>
    <div class="tools">
      <div class="search" title="Pesquisar ( / )">
        <span aria-hidden="true">🔎</span>
        <input id="search" placeholder="Buscar…" aria-label="Buscar" />
      </div>
      <select id="langSel" class="ghost" aria-label="Idioma">
        <option value="pt">PT</option>
        <option value="en">EN</option>
      </select>
      <button id="themeBtn" class="ghost" aria-label="Tema">🌗</button>
    </div>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite" aria-busy="false"></main>

<footer class="site">
  <div class="wrap">
    <p class="muted">Biblioteca minimal — SPA + PWA — Offline pronto ✓</p>
  </div>
</footer>

<script>
/* =============================
   Estado, i18n, utilitários
============================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const state = {
  theme: localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'),
  lang: localStorage.getItem('lang') || 'pt'
};
document.body.setAttribute('data-theme', state.theme);
$('#langSel').value = state.lang;
function save(k,v){ localStorage.setItem(k, v); }

/* i18n mínimo */
const I18N = {
  pt:{
    brand:'Santo Agostinho',
    homeTitle:'Bem-vindo(a)',
    homeLead:'Uma biblioteca minimal com as ideias de Santo Agostinho.',
    menu:{home:'Início',life:'Vida',works:'Obras',concepts:'Conceitos',quotes:'Frases',timeline:'Linha',notes:'Notas',comments:'Comentários',about:'Sobre'},
    notes:{title:'Notas (Markdown)',save:'Salvar',print:'Imprimir'},
    comments:{title:'Comentários',empty:'Ainda sem comentários nesta página.',placeholder:'Escreva seu comentário…',publish:'Publicar'},
    about:{title:'Sobre',desc:'SPA minimalista com rotas, busca com realce, i18n, notas em Markdown (com impressão), comentários offline, quiz e PWA.'}
  },
  en:{
    brand:'Saint Augustine',
    homeTitle:'Welcome',
    homeLead:'A minimal library for the ideas of Saint Augustine.',
    menu:{home:'Home',life:'Life',works:'Works',concepts:'Concepts',quotes:'Quotes',timeline:'Timeline',notes:'Notes',comments:'Comments',about:'About'},
    notes:{title:'Notes (Markdown)',save:'Save',print:'Print'},
    comments:{title:'Comments',empty:'No comments yet on this page.',placeholder:'Write your comment…',publish:'Publish'},
    about:{title:'About',desc:'Minimal SPA with routes, highlighted search, i18n, Markdown notes (printable), offline comments, quiz and PWA.'}
  }
};
function t(path){
  const parts = path.split('.'); let o = I18N[state.lang];
  for(const p of parts){ if(!o) break; o = o[p]; }
  return o || path;
}
function applyI18n(){
  $('#siteTitle').textContent = t('brand');
  $$('#menu [data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
}

/* =============================
   Conteúdo
============================= */
const DATA = {
  bio:{
    intro:`Aurelius Augustinus (354–430) nasceu em Tagaste. Após buscas filosófico-religiosas (incl. maniqueísmo), converteu-se em 387 (batismo de Ambrósio), tornou-se bispo de Hipona e escreveu obras que moldaram a teologia ocidental.`
  },
  works:[
    {title:'Confissões', year:398, theme:'autobiografia', desc:'Memória, tempo e graça.'},
    {title:'A Cidade de Deus', year:426, theme:'história', desc:'Duas cidades: Deus e dos homens.'},
    {title:'De Trinitate', year:419, theme:'trindade', desc:'Analogia trinitária na mente.'},
    {title:'De Doctrina Christiana', year:397, theme:'hermenêutica', desc:'Interpretação e ensino.'},
    {title:'Enchiridion', year:421, theme:'catequese', desc:'Fé, esperança e caridade.'}
  ],
  concepts:[
    {k:'Graça', v:'Dom imerecido que cura a vontade.'},
    {k:'Livre-arbítrio', v:'Liberdade real, ferida; coopera com a graça.'},
    {k:'Tempo e memória', v:'Distensão da alma (memória, atenção, expectativa).'},
    {k:'Igreja', v:'Corpo de Cristo, peregrina rumo à Cidade de Deus.'}
  ],
  timeline:[
    {y:354, e:'Nascimento em Tagaste.'},
    {y:371, e:'Estudos em Cartago; maniqueísmo.'},
    {y:384, e:'Retórica em Milão; contato com Ambrósio.'},
    {y:387, e:'Conversão e batismo.'},
    {y:391, e:'Ordenação em Hipona.'},
    {y:395, e:'Bispo de Hipona.'},
    {y:398, e:'Publica Confissões.'},
    {y:426, e:'Conclui Cidade de Deus.'},
    {y:430, e:'Falecimento em Hipona.'}
  ],
  quotes:[
    '“Inquieto está o nosso coração enquanto não repousa em Ti.”',
    '“Ama e faze o que quiseres.”',
    '“Tarde te amei, ó Beleza tão antiga e tão nova.”'
  ]
};

/* =============================
   Views (rotas)
============================= */
const routes = {
  '/': () => `
    <section class="panel">
      <h2>${t('homeTitle')}</h2>
      <p class="muted">${t('homeLead')}</p>
    </section>
    <div class="grid cols-3" style="margin-top:14px">
      <div class="panel card"><h3>Vida</h3><p class="muted">${DATA.bio.intro}</p><a class="btn" href="#/vida">Ler</a></div>
      <div class="panel card"><h3>Obras</h3><p class="muted">Confissões, Cidade de Deus, De Trinitate, …</p><a class="btn" href="#/obras">Explorar</a></div>
      <div class="panel card"><h3>Conceitos</h3><p class="muted">Graça, liberdade, tempo, Igreja…</p><a class="btn" href="#/conceitos">Ver</a></div>
    </div>
  `,
  '/vida': () => `
    <section class="panel">
      <h2>Vida</h2>
      <p>${DATA.bio.intro}</p>
      <div class="timeline" style="margin-top:10px">
        ${DATA.timeline.map(i=>`<div class="row"><strong>${i.y}</strong> — ${i.e}</div>`).join('')}
      </div>
    </section>
  `,
  '/obras': () => `
    <section class="panel">
      <h2>Obras</h2>
      <div class="grid cols-2" id="worksGrid"></div>
      <div class="field" style="margin-top:10px">
        <label for="workFilter">Filtro:</label>
        <select id="workFilter">
          <option value="all">Todas</option>
          <option value="<=400">Até 400</option>
          <option value=">400">&gt; 400</option>
        </select>
      </div>
    </section>
  `,
  '/conceitos': () => `
    <section class="panel">
      <h2>Conceitos</h2>
      <div class="grid cols-2">
        ${DATA.concepts.map(c=>`<div class="card"><h3>${c.k}</h3><p class="muted">${c.v}</p></div>`).join('')}
      </div>
    </section>
  `,
  '/frases': () => `
    <section class="panel">
      <h2>Frases</h2>
      <ul class="clean">
        ${DATA.quotes.map(q=>`<li>${q}</li>`).join('')}
      </ul>
    </section>
  `,
  '/linha': () => `
    <section class="panel">
      <h2>Linha do Tempo</h2>
      <div class="timeline">
        ${DATA.timeline.map(i=>`<div class="row"><strong>${i.y}</strong> — ${i.e}</div>`).join('')}
      </div>
    </section>
  `,
  '/quiz': () => `
    <section class="panel">
      <h2>Quiz</h2>
      <form id="quizForm" style="margin-top:8px"></form>
      <div class="field" style="margin-top:10px; gap:10px">
        <button id="submitQuiz" class="btn">Enviar</button>
        <span id="quizScore" class="tag"></span>
      </div>
    </section>
  `,
  '/notas': () => `
    <section class="panel">
      <h2>${t('notes.title')}</h2>
      <div class="grid cols-2" style="margin-top:8px">
        <div>
          <textarea id="mdInput" placeholder="# Minhas notas\n\n- Use **Markdown**."></textarea>
          <div class="field" style="margin-top:8px; gap:8px">
            <button id="saveNote" class="btn">${t('notes.save')}</button>
            <button id="printNote" class="ghost">${t('notes.print')}</button>
          </div>
        </div>
        <div>
          <h3>Preview</h3>
          <div id="mdPreview" class="panel" style="min-height:140px; background:var(--panel-2)"></div>
        </div>
      </div>
    </section>
  `,
  '/comentarios': () => `
    <section class="panel">
      <h2>${t('comments.title')}</h2>
      <div id="commentsList" class="grid" style="margin-top:8px"></div>
      <div class="panel" style="margin-top:10px; background:var(--panel-2)">
        <textarea id="commentText" placeholder="${t('comments.placeholder')}"></textarea>
        <div class="field" style="margin-top:8px; gap:8px">
          <input id="commentAuthor" placeholder="Seu nome" class="ghost" style="padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--panel)" />
          <button id="sendComment" class="btn">${t('comments.publish')}</button>
        </div>
      </div>
    </section>
  `,
  '/sobre': () => `
    <section class="panel">
      <h2>${t('about.title')}</h2>
      <p class="muted">${t('about.desc')}</p>
      <p class="muted">Atalhos: <kbd>/</kbd> buscar • <kbd>ALT</kbd>+<kbd>T</kbd> tema • <kbd>ALT</kbd>+<kbd>L</kbd> idioma</p>
    </section>
  `
};

/* =============================
   Router + render
============================= */
function render(){
  const hash = location.hash.replace('#','') || '/';
  $$('#menu [data-route]').forEach(a => a.classList.toggle('active', a.getAttribute('href')==='#'+hash));
  const view = routes[hash] ? routes[hash]() : `<section class="panel"><h2>404</h2><p>Página não encontrada.</p></section>`;
  const container = $('#main');
  container.setAttribute('aria-busy','true');
  container.innerHTML = view;
  container.setAttribute('aria-busy','false');
  postRender(hash);
  indexSearch();
  window.scrollTo({top:0, behavior:'smooth'});
}
window.addEventListener('hashchange', render);

/* =============================
   Pós-render por rota
============================= */
function postRender(hash){
  if(hash==='/obras'){
    const grid = $('#worksGrid');
    const draw = ()=>{
      const f = $('#workFilter').value;
      const arr = DATA.works.filter(w => f==='all' ? true : (f==='<=400'? w.year<=400 : w.year>400));
      grid.innerHTML = arr.map(o=>`
        <div class="card panel">
          <h3>${o.title} <span class="tag">${o.year}</span></h3>
          <p class="muted">${o.desc} • <em>${o.theme}</em></p>
        </div>`).join('');
    };
    $('#workFilter').onchange = draw; draw();
  }
  if(hash==='/quiz'){ initQuiz(); }
  if(hash==='/notas'){ initNotes(); }
  if(hash==='/comentarios'){ initComments(); }
}

/* =============================
   Busca com realce
============================= */
let SEARCH_INDEX = [];
function indexSearch(){
  SEARCH_INDEX.length = 0;
  $$('#main h1, #main h2, #main h3, #main p, #main li').forEach(el=>{
    SEARCH_INDEX.push({el, text: el.textContent.toLowerCase()});
  });
}
function clearMarks(){ $$('#main mark').forEach(m=> m.replaceWith(document.createTextNode(m.textContent))); }
$('#search').addEventListener('input', e=>{
  const term = e.target.value.trim().toLowerCase();
  clearMarks();
  if(!term) return;
  SEARCH_INDEX.forEach(({el, text})=>{
    if(text.includes(term) && el.childNodes.length===1 && el.childNodes[0].nodeType===3){
      const raw = el.textContent;
      const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
      el.innerHTML = raw.replace(re, m=>`<mark>${m}</mark>`);
    }
  });
  const first = $('#main mark'); if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
});
// atalho de teclado para buscar
window.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); $('#search').focus();
  }
});

/* =============================
   Quiz simples
============================= */
function initQuiz(){
  const Q = [
    {q:'Em que ano Agostinho foi batizado?', a:['354','387','410','430'], c:1},
    {q:'Qual obra responde à queda de Roma?', a:['Confissões','De Trinitate','A Cidade de Deus','Enchiridion'], c:2},
    {q:'Para Agostinho, o tempo é…', a:['Absoluto','Distensão da alma','Apenas físico','Idêntico à eternidade'], c:1}
  ];
  const form = $('#quizForm');
  form.innerHTML = Q.map((p,i)=>`
    <fieldset class="panel" style="background:var(--panel-2)">
      <legend><strong>${i+1}. ${p.q}</strong></legend>
      ${p.a.map((opt,j)=>`<label style="display:block;margin:.25rem 0"><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`).join('')}
    </fieldset>
  `).join('');
  $('#submitQuiz').onclick = (ev)=>{
    ev.preventDefault();
    let score=0; Q.forEach((p,i)=>{
      const v=(new FormData(form)).get('q'+i);
      if(Number(v)===p.c) score++;
    });
    $('#quizScore').textContent = `Pontuação: ${score}/${Q.length}`;
  };
}

/* =============================
   Notas (Markdown + preview + impressão)
============================= */
function mdToHtml(md){
  let h = md
    .replace(/^### (.*)$/gim,'<h3>$1</h3>')
    .replace(/^## (.*)$/gim,'<h2>$1</h2>')
    .replace(/^# (.*)$/gim,'<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/gim,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/gim,'<em>$1</em>')
    .replace(/`([^`]+)`/gim,'<code>$1</code>')
    .replace(/^\s*-\s+(.*)$/gim,'<li>$1</li>');
  h = h.replace(/(<li>.*<\/li>)/gims,'<ul>$1</ul>');
  h = h.replace(/\n{2,}/g,'<br/><br/>');
  return h.trim();
}
function initNotes(){
  const key='notes-md';
  const input=$('#mdInput'), prev=$('#mdPreview');
  input.value = localStorage.getItem(key) || '';
  prev.innerHTML = mdToHtml(input.value || '');
  input.addEventListener('input', ()=> prev.innerHTML = mdToHtml(input.value));
  $('#saveNote').onclick = (e)=>{ e.preventDefault(); localStorage.setItem(key, input.value); toast('Nota salva'); };
  $('#printNote').onclick = (e)=>{
    e.preventDefault();
    const w=window.open('','_blank');
    w.document.write(`<!doctype html><title>Notas</title><style>body{font-family:system-ui,Arial;padding:24px} h1,h2,h3{margin:.5em 0}</style>${prev.innerHTML}`);
    w.document.close(); w.focus(); w.print();
  };
}

/* =============================
   Comentários offline por rota
============================= */
function commentsKey(){ return 'comments:'+ (location.hash.replace('#','')||'/'); }
function loadComments(){ return JSON.parse(localStorage.getItem(commentsKey())||'[]'); }
function saveComments(arr){ localStorage.setItem(commentsKey(), JSON.stringify(arr)); }
function initComments(){
  const list = $('#commentsList');
  const renderList = ()=>{
    const arr = loadComments();
    if(arr.length===0){ list.innerHTML = `<p class="muted">${t('comments.empty')}</p>`; return; }
    list.innerHTML = arr.map(c=>`
      <div class="comment">
        <div class="muted" style="font-size:.85rem">${c.author||'Anônimo'} • ${new Date(c.ts).toLocaleString()}</div>
        <div>${c.text.replace(/</g,'&lt;')}</div>
      </div>`).join('');
  };
  renderList();
  $('#sendComment').onclick = ()=>{
    const text = $('#commentText').value.trim();
    if(!text) return;
    const author = $('#commentAuthor').value.trim();
    const arr = loadComments();
    arr.unshift({text, author, ts: Date.now()});
    saveComments(arr);
    $('#commentText').value=''; renderList(); toast('Comentário publicado');
  };
}

/* =============================
   UI simples
============================= */
function toast(msg){
  const el=document.createElement('div');
  el.textContent = msg;
  Object.assign(el.style,{position:'fixed',left:'50%',bottom:'20px',transform:'translateX(-50%)',padding:'8px 12px',background:'var(--panel)',border:'1px solid var(--border)',borderRadius:'10px',zIndex:10});
  document.body.appendChild(el); setTimeout(()=> el.remove(),1400);
}
$('#themeBtn').onclick = ()=>{
  state.theme = (state.theme==='light'?'dark':'light');
  document.body.setAttribute('data-theme', state.theme);
  save('theme', state.theme);
};
$('#langSel').onchange = ()=>{
  state.lang = $('#langSel').value; save('lang', state.lang); applyI18n(); render();
};
// atalhos: ALT+T tema / ALT+L idioma
window.addEventListener('keydown', e=>{
  if(e.altKey && (e.key==='t'||e.key==='T')) { e.preventDefault(); $('#themeBtn').click(); }
  if(e.altKey && (e.key==='l'||e.key==='L')) { e.preventDefault(); state.lang = state.lang==='pt'?'en':'pt'; $('#langSel').value=state.lang; save('lang',state.lang); applyI18n(); render(); }
});

/* =============================
   Inicialização
============================= */
applyI18n();
render();

/* =============================
   Schema/SEO mínimo
============================= */
const ld = {
  '@context':'https://schema.org','@type':'Person',
  name:'Aurelius Augustinus','alternateName':'Santo Agostinho',
  birthDate:'0354-11-13','deathDate':'0430-08-28',
  sameAs:['https://pt.wikipedia.org/wiki/Agostinho_de_Hipona']
};
const s=document.createElement('script'); s.type='application/ld+json'; s.textContent=JSON.stringify(ld); document.head.appendChild(s);

/* =============================
   PWA básico (SW via Blob)
============================= */
if('serviceWorker' in navigator){
  const sw = `
    const CACHE='agostinho-min-v1';
    self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./']))); self.skipWaiting();});
    self.addEventListener('activate',e=>self.clients.claim());
    self.addEventListener('fetch',e=>{
      e.respondWith(
        caches.match(e.request).then(r=> r || fetch(e.request).then(res=>{
          const cp=res.clone(); caches.open(CACHE).then(c=>c.put(e.request,cp)); return res;
        }).catch(()=> caches.match('./')))
      );
    });
  `;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'})));
}
</script>
